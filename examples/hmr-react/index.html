<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ling-cordis · HMR 最小示例</title>
    <script>
      // 热更实证锚：整页装载计数——HMR 热替换不重跑本行（保持 1），整页刷新会 +1
      window.__bootCount = (window.__bootCount ?? 0) + 1
    </script>
  </head>
  <body>
    <div id="root">装载中（/packages/demo 拉取中）……</div>
    <!-- 子应用装载收归框架（2026-10-26 用户令「shell.ts 坏味道优化掉、配置/动作统一
         收归 ling.config.mjs」）：一行经典 script——键序=ling.config.mjs 模块清单
         client.key；dev 态经 vite base 前缀 /app/__ling/main.js 框架同源应答，
         React 前导由 plugin-react 的 transformIndexHtml 无条件注入 html 管线；
         构建态 vite build 对经典外链原样保留 -->
    <script src="/__ling/main.js"></script>
  </body>
</html>
