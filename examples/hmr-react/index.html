<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ling-cordis · HMR 最小示例</title>
    <script>
      // 热更实证锚：整页装载计数——HMR 热替换不重跑本行（保持 1），整页刷新会 +1
      window.__bootCount = (window.__bootCount ?? 0) + 1
    </script>
  </head>
  <body>
    <div id="root">装载中（/packages/demo 拉取中）……</div>
    <!-- ling-web 形态 module 入口：dev=vite 直载（React 前导自动注入）、
         构建=进 dist 资产；面板装载正路在 src/shell.ts（运行时 URL 免改写坑） -->
    <script type="module" src="/src/shell.ts"></script>
  </body>
</html>
