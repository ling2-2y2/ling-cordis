# ling-coris 标准消费者编排样例（docker compose up -d 即起）
# 正式发布钉版：LING_CORIS_VERSION 传具体版本号（scripts/release.mjs 自动带）；
# 缺省 latest=日常档（随 npm 最新走）
services:
  hmr-react:
    build:
      context: .
      args:
        LING_CORIS_VERSION: "latest"
    image: ling-coris/hmr-react:latest
    container_name: ling-hmr-react
    ports:
      - "8391:8391"
    environment:
      - HOST=0.0.0.0        # 容器内必须 0.0.0.0，否则端口映射后不可达（ling.config.mjs 读 HOST）
      - PORT=8391
    restart: unless-stopped
