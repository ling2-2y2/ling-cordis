<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dev-app demo</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 4rem auto; padding: 0 1rem; }
      button { padding: 0.4rem 1rem; cursor: pointer; }
      pre { background: #f4f4f4; padding: 0.8rem; border-radius: 6px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>dev-app demo</h1>
    <p>一份 <code>ling.config.mjs</code> 薄配置跑起来的最小平台：三相插件挂载 + JSON-RPC 网关（登录 / 参数绑定 / 会话门）+ 静态 SPA，全在同端口。</p>
    <button id="go">登录并调用 demo.hello</button>
    <pre id="out">（点按钮）</pre>
    <script type="module">
      const out = document.getElementById('out')
      document.getElementById('go').onclick = async () => {
        out.textContent = '登录中（demo/123456）…'
        const login = await (await fetch('/api/auth/login', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ account: 'demo', password: '123456' }),
        })).json()
        out.textContent = `登录 ok=${login.ok} token=${login.token}\n调用 /api/demo/hello …`
        const reply = await (await fetch('/api/demo/hello', {
          method: 'POST', headers: { 'content-type': 'application/json', satoken: login.token },
          body: JSON.stringify({ args: { name: '浏览器' } }),
        })).json()
        out.textContent += `\nRPC 应答：${JSON.stringify(reply)}`
      }
    </script>
  </body>
</html>
